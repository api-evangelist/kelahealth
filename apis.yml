name: kelaHealth
description: >-
  kelaHealth is a healthcare AI company that improves surgical outcomes through
  its Surgical Intelligence Service, an AI-enabled API delivering patient-specific
  predictive insights at critical decision points across the perioperative
  process. Models trained on millions of surgical procedures predict individual
  patient risk across nine major complication categories, identify modifiable
  factors, and recommend stratified interventions tailored to hospital standards.
  The service integrates into existing medtech and healthcare software
  applications using EHR, robotic, and social-determinants-of-health data to help
  providers improve growth, efficiency, quality, and safety. kelaHealth is HIPAA
  compliant and backed by Techstars. It does not publish a public developer
  portal, OpenAPI specification, or SDKs; its API is delivered through partner
  integrations.
